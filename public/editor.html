<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizParty — Editor</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bg:#f6f5fb; --card:#fff; --ink:#1d1a33; --muted:#6b6790; --line:#e3e0f0; --accent:#6d4aff; --bad:#d93a4a; --good:#1a9f5c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); font-size:15px; }
  header { position:sticky; top:0; z-index:5; background:var(--ink); color:#fff; display:flex; align-items:center; gap:16px; padding:10px 20px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; margin-right:auto; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { background:transparent; border:0; color:#cfcaf0; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px; }
  nav button.on { background:rgba(255,255,255,.15); color:#fff; }
  .savebtn { background:var(--accent); color:#fff; border:0; padding:9px 18px; border-radius:8px; font-weight:600; cursor:pointer; }
  .savebtn.dirty { background:#ff8a00; }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
  .layout { display:grid; grid-template-columns:340px 1fr; gap:18px; align-items:start; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .list { max-height:75vh; overflow:auto; padding:6px; }
  .item { padding:9px 10px; border-radius:8px; cursor:pointer; display:flex; gap:8px; align-items:center; }
  .item:hover { background:#f0edfb; }
  .item.on { background:#e7e1ff; }
  .item .tag { font-size:11px; background:#eee; border-radius:6px; padding:1px 6px; color:var(--muted); white-space:nowrap; }
  .item .warn { color:var(--bad); font-size:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; font-weight:600; }
  input[type=text], input[type=number], input[type=password], select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:90px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row > * { flex:1; }
  .btn { border:1px solid var(--line); background:#fff; padding:7px 12px; border-radius:8px; cursor:pointer; font:inherit; font-size:14px; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.danger { color:var(--bad); }
  .btn.sm { padding:4px 8px; font-size:13px; }
  .opt-row { display:grid; grid-template-columns:28px 1fr 32px; gap:8px; align-items:center; margin-bottom:6px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:4px; border-bottom:1px solid var(--line); font-size:14px; }
  td input { padding:5px 7px !important; }
  .hint { font-size:13px; color:var(--muted); }
  .preview img, .preview video { max-width:100%; max-height:220px; border-radius:8px; margin-top:8px; }
  .bands { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .bands div { background:#f0edfb; border-radius:8px; padding:6px; font-size:12px; }
  .bands b { display:block; font-size:11px; color:var(--muted); }
  .empty { color:var(--muted); text-align:center; padding:40px; }
  .ok { color:var(--good); } .bad { color:var(--bad); }
  #login { max-width:360px; margin:80px auto; }
</style>
</head>
<body>
<header>
  <h1>🎮 QuizParty Editor</h1>
  <nav id="tabs"></nav>
  <button class="savebtn" id="save">Save</button>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script src="/editor.js"></script>
</body>
</html>
